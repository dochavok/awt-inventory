# Unconditional grants and permissions of each skill (SK-7, RD-1), from the card
# text in skills.yaml (2026-11-17). A grant with a `condition` is situational:
# listed, never added to a total (GR-4). Within a `group` only the largest
# grant counts (GR-1: holy-die, tactical-die, acrobatics-die, cm-vs-evil), and
# a `die-always` grant makes the group's die count in the combat dice.
