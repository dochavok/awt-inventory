# The AWT level chart (RD-1), levels 1 to 75, from "Level Chart.pdf" (Adventures
# from the Wizard Tower). Game content, used with the owner's agreement (Q10,
# 2026-11-17).
#
# How the PDF was read (decisions with Craig, 2026-11-17):
# - The PDF prints a value only where it changes; a blank cell keeps the value
#   above it. Every level here carries that value.
# - Combat dice: one column for all three classes, copied into each.
# - From level 11 the combat dice are two dice ("1d20 + 1d4"), written as
#   printed.
# - Rogue Stealth Bonus from level 10 is dice plus 3 ("1d4 + 3"): classBonus
#   holds the number, classBonusDice the dice.
# - Warrior Combat Bonus at levels 73 to 75: the PDF prints +81; corrected to
#   +83, the chart's own step of 4 (Q13).
# - Starting arcane slots aren't in the PDF: Warrior 0, Rogue 1, Mage 2 come
#   from requirements section 17.
# - skillGained: the class's column says "Skill" (Mage: "Spell") at that level.
#   arcaneSlot: it says "Arcane Slot".
