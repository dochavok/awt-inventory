# The AWT skill and spell list (RD-1, RD-6): every tree and card on the skill
# tree sheets, as of 2026-11-17 (several sheets updated by Craig that day).
# Game content, used with the owner's agreement (Q10, 2026-11-17). Open
# readings are DM questions Q14 to Q16. IDs are permanent once released (RD-2).
#
# A card printed in several trees is one skill with `trees:`, a list of
# placements ({ tree, starting?, prerequisites? }), in place of `tree`,
# `starting` and `prerequisites` (RD-1, SK-1a).

trees:
  - {id: warrior, name: Warrior, kind: class, classes: [Warrior]}
  - {id: mage, name: Mage, kind: class, classes: [Mage]}
  - {id: rogue, name: Rogue, kind: class, classes: [Rogue]}
  - {id: battlecaster, name: Battlecaster, kind: advanced, classes: [Warrior, Mage]}
  - {id: berserker, name: Berserker, kind: advanced, classes: [Warrior]}
  - {id: holy-knight, name: Holy Knight, kind: advanced, classes: [Warrior]}
  - {id: ranged, name: Ranged, kind: advanced, classes: [Warrior, Rogue]}
  - {id: swashbuckler, name: Swashbuckler, kind: advanced, classes: [Warrior, Rogue]}
  - {id: acrobat, name: Acrobat, kind: advanced, classes: [Rogue]}
  - {id: assassin, name: Assassin, kind: advanced, classes: [Rogue]}
  - {id: death, name: Death, kind: advanced, classes: [Mage]}
  - {id: sorcerer, name: Sorcerer, kind: advanced, classes: [Mage], maintainerNote: 'The Mage sheet says ''Requires Elemental Magic (Any 2 Elements)'': two elements ticked on Elemental Magic, which the data can''t check.'}
  - {id: worldshaper, name: Worldshaper, kind: advanced, classes: [Mage]}
  - {id: thief, name: Thief, kind: advanced, classes: [Rogue]}
  - {id: cleric, name: Cleric, kind: advanced, classes: [Mage], maintainerNote: 'Requirement from Craig (2026-11-17) and the updated Mage sheet: Cleric Tree requires Lesser Recovery.'}
  - {id: tactician, name: Tactician, kind: advanced, classes: [Warrior], maintainerNote: 'Its sheet prints ''Improved Weapon Focus, Ranged Use, Parry, Over Press''; ''Ranged Use'' read as Ranged Weapon Use, all four needed (Craig 2026-11-17). Nothing on the Warrior sheet leads to it.'}
  - {id: toxicology, name: Toxicology, kind: advanced, classes: [Rogue]}
  - {id: gladiator, name: Gladiator, kind: prestige, classes: [Warrior], entryLevel: 51, maintainerNote: 'Needs ''a Berserker Tree Epic Skill'': Death Throes is the only one (purple gem, no [Epic] label).'}
  - {id: paladin, name: Paladin, kind: prestige, classes: [Warrior], entryLevel: 51}
  - {id: commander, name: Commander, kind: prestige, classes: [Warrior], entryLevel: 51, maintainerNote: '''Tactician Epic Skills'' read as both Tactician Epics (Craig 2026-11-17).'}
  - {id: cutthroat, name: Cutthroat, kind: prestige, classes: [Rogue], entryLevel: 51, maintainerNote: 'Its sheet prints only ''Assassinate, Deadly Stealth'', no Level 51; level 51 added like the other prestige trees (Craig 2026-11-17; DM question).'}
  - {id: poison-master, name: Poison Master, kind: prestige, classes: [Rogue], entryLevel: 51}
  - {id: acquisitions-agent, name: Acquisitions Agent, kind: prestige, classes: [Rogue], entryLevel: 51, maintainerNote: 'Needs ''a Thief Tree Epic Skill'', but no Thief skill is Epic; Guild Connections (the Thief tree''s locked capstone) used until the DMs say (Craig 2026-11-17; DM question).'}
  - {id: alchemist, name: Alchemist, kind: prestige, classes: [Mage], entryLevel: 51}
  - {id: arch-lich, name: Arch-Lich, kind: prestige, classes: [Mage], entryLevel: 51, maintainerNote: Printed 'Arch-Litch'; corrected (Craig 2026-11-17).}
  - {id: elementalist, name: Elementalist, kind: prestige, classes: [Mage], entryLevel: 51, maintainerNote: Printed 'Elamentalist'; corrected (Craig 2026-11-17).}
  - {id: high-priest, name: High Priest, kind: prestige, classes: [Mage], entryLevel: 51}

skills:

  # Warrior
  - id: weapon-use
    name: Weapon Use
    trees:
    - {tree: warrior, starting: true}
    - {tree: rogue, starting: true}
    - tree: cleric
      prerequisites: {skill: holy-vow}
    usage: passive
    tier: normal
    text: Can Equip Weapons.
    maintainerNote: 'Also printed on the Mage sheet, marked (Warrior Skill), only to show Battlecaster''s
      requirement. In Cleric it follows Holy Vow, but a Mage can get Weapon Use other ways (Craig 2026-11-17).
      The Cleric sheet prints: "Can Equip Weapons"'
  - id: ranged-weapon-use
    name: Ranged Weapon Use
    trees:
    - {tree: warrior, starting: true}
    - {tree: rogue, starting: true}
    usage: passive
    tier: normal
    text: Can equip ranged weapons.
  - id: ranged-training
    name: Ranged Training
    trees:
    - tree: warrior
      prerequisites: {skill: ranged-weapon-use}
    - tree: rogue
      prerequisites: {skill: ranged-weapon-use}
    usage: passive
    tier: normal
    text: Gain +3 CM (Attack) when using a ranged weapon.
    maintainerNote: 'The Rogue sheet prints: "Gain +3 to combat rolls with ranged weapons."'
  - id: attack-tactics
    name: Attack Tactics
    trees:
    - {tree: warrior, starting: true}
    - tree: swashbuckler
      prerequisites: {skill: fend}
    usage: passive
    tier: normal
    text: +3 to Combat Modifier (Attack) May damage 1 ranged opponent.
    maintainerNote: 'The Swashbuckler sheet prints: "+3 to CM (Attack) May damage 1 ranged opponent."'
  - id: disarm
    name: Disarm
    trees:
    - tree: warrior
      prerequisites: {skill: attack-tactics}
    - tree: swashbuckler
      prerequisites: {skill: defensive-tactics}
    usage: 1/combat
    tier: normal
    text: Knock a foe's item to the ground. They cannot use it until they task to retrieve it.
  - id: sunder
    name: Sunder
    trees:
    - tree: warrior
      prerequisites: {skill: disarm}
    - tree: swashbuckler
      prerequisites: {skill: disarm}
    usage: 1/combat
    tier: normal
    text: Break a non-epic item a foe has equipped or is using.
  - id: press
    name: Press
    tree: warrior
    usage: 1/combat
    tier: normal
    text: After a combat roll is totaled, add an additional +4
    prerequisites: {skill: attack-tactics}
  - id: over-press
    name: Over Press
    tree: warrior
    usage: 1/combat
    tier: normal
    text: Remove 1 Foe's CM (Attack) this round.
    prerequisites: {skill: press}
  - id: strength-training
    name: Strength Training
    tree: warrior
    usage: passive
    tier: normal
    text: Gain another +2 CM (Attack) and +2 to Strength based Challenge Rolls.
    prerequisites: {skill: attack-tactics}
  - id: strength-conditioning
    name: Strength Conditioning
    tree: warrior
    usage: passive
    tier: normal
    text: Gain another +2 CM (Attack) and Strength-based Challenge Rolls.
    prerequisites: {skill: strength-training}
  - id: strength-mastery
    name: Strength Mastery
    tree: warrior
    usage: passive
    tier: normal
    text: Gain another +2 CM (Attack) Your attacks ignore 1♥ of resistance.
    prerequisites: {skill: strength-conditioning}
  - id: true-warrior
    name: True Warrior
    tree: warrior
    usage: passive
    tier: epic
    text: Your attacks now add +1♥ of damage. You may now use Mettle each round.
    prerequisites:
      all:
      - {skill: over-press}
      - {skill: strength-mastery}
  - id: armor-use
    name: Armor Use
    trees:
    - {tree: warrior, starting: true}
    - tree: battlecaster
      prerequisites:
        all:
        - {skill: weapon-use}
        - {skill: knowledge}
    usage: passive
    tier: normal
    text: Can equip armor and shields.
  - id: defensive-tactics
    name: Defensive Tactics
    trees:
    - {tree: warrior, starting: true}
    - tree: swashbuckler
      prerequisites: {skill: attack-tactics}
    usage: passive
    tier: normal
    text: Gain +3 CM (Defence) 1/round you may take 1♥ of damage for 1 ally.
  - id: vigor
    name: Vigor
    tree: warrior
    usage: passive
    tier: normal
    text: Gain +2 CM (Defence) and +2 to Challenge Rolls to resist damage.
    prerequisites: {skill: defensive-tactics}
  - id: resilience
    name: Resilience
    tree: warrior
    usage: passive
    tier: normal
    text: Gain +2 CM (Defence) and +2 to Challenge Rolls vs. afflictions.
    prerequisites: {skill: vigor}
  - id: mettle
    name: Mettle
    tree: warrior
    usage: 1/combat
    tier: normal
    text: Remove 1♥ to regain the use of one used skill from the Warrior Base Tree.
    prerequisites:
      all:
      - {skill: strength-training}
      - {skill: resilience}
  - id: toughness
    name: Toughness
    tree: warrior
    usage: passive
    tier: normal
    text: Gain +1♥ to your maximum ♥s You can take this skill up to 5 times.
    prerequisites: {skill: mettle}
    maxTimes: 5
  - id: poise
    name: Poise
    tree: warrior
    usage: passive
    tier: normal
    text: Gain +2 CM (Defence)
    prerequisites: {skill: resilience}
  - id: defend
    name: Defend
    tree: warrior
    usage: 1/combat
    tier: normal
    text: Take all damage for 1 ally.
    prerequisites: {skill: defensive-tactics}
  - id: parry
    name: Parry
    trees:
    - tree: warrior
      prerequisites: {skill: defend}
    - tree: swashbuckler
      prerequisites: {skill: footwork}
    usage: 1/combat
    tier: normal
    text: Remove a foe's Combat Modifier (Attack)
  - id: stalwart
    name: Stalwart
    tree: warrior
    usage: passive
    tier: normal
    text: When using Warrior Skills that take a hit for an ally, you can apply your resistances.
    prerequisites:
      all:
      - {skill: poise}
      - {skill: parry}
  - id: true-guardian
    name: True Guardian
    tree: warrior
    usage: passive
    tier: epic
    text: As Stalwart but apply immunities. You gain 1♥ of Resistance vs physical damage.
    prerequisites: {skill: stalwart}
  - {id: bounty-hunter, name: Bounty Hunter, tree: warrior, usage: passive, tier: normal, text: Gain 1 Zenni
      for each monster type slain., starting: true}
  - id: trophy-taker
    name: Trophy Taker
    tree: warrior
    usage: 1/day
    tier: normal
    text: 1/day When you defeat a foe, gain 1 minor monster part.
    prerequisites: {skill: bounty-hunter}
  - id: hamstring
    name: Hamstring
    tree: warrior
    usage: 1/combat
    tier: normal
    text: Negate 1 opponent ability that would allow them to flee combat.
    prerequisites: {skill: trophy-taker}
  - id: dual-wielding
    name: Dual Wielding
    trees:
    - {tree: warrior, starting: true}
    - tree: rogue
      prerequisites: {skill: weapon-use}
    - tree: battlecaster
      prerequisites:
        all:
        - {skill: weapon-use}
        - {skill: knowledge}
    usage: passive
    tier: normal
    text: Can equip two one-handed weapons at once.
  - {id: weapon-focus, name: Weapon Focus, tree: warrior, usage: passive, tier: normal, text: +3 to CM (Attack)
      with a specific weapon group., starting: true}
  - id: fend
    name: Fend
    trees:
    - tree: warrior
      prerequisites: {skill: weapon-focus}
    - tree: rogue
      prerequisites: {skill: weapon-use}
    usage: 1/combat
    tier: normal
    text: Add 1 equipped weapon's bonus as CM (Defence) this round.
    maintainerNote: 'The Rogue sheet prints: "Add your equipped weapon''s bonus as CM (Defence)"'
  - id: improved-weapon-focus
    name: Improved Weapon Focus
    tree: warrior
    usage: passive
    tier: normal
    text: Additional +2 CM (Attack) with a specific weapon group. (Total +5)
    prerequisites: {skill: weapon-focus}
  - id: weapon-focus-mastery
    name: Weapon Focus Mastery
    tree: warrior
    usage: passive
    tier: normal
    text: Additional +2 CM (Attack) with a specific weapon group. (Total +7)
    prerequisites: {skill: improved-weapon-focus}

  # Mage
  - {id: knowledge, name: Knowledge, tree: mage, usage: passive, tier: normal, text: Get one hint for free.,
    starting: true, maintainerNote: 'Also printed on the Warrior sheet, marked (Mage Skill), only to show
      Battlecaster''s requirement.'}
  - id: lore
    name: Lore
    tree: mage
    usage: passive
    tier: normal
    text: Learn information about an enemy or event before the quest.
    prerequisites: {skill: knowledge}
  - {id: elemental-magic, name: Elemental Magic, tree: mage, usage: passive, tier: normal, text: You can
      add chosen element to the damage types you know., starting: true}
  - id: enchant
    name: Enchant
    tree: mage
    usage: task
    tier: normal
    text: Choose an element you have Elemental Magic for. You can enchant 1 weapon with that damage type
      for the rest of combat.
    prerequisites:
      all:
      - {skill: lore}
      - {skill: elemental-magic}
  - {id: light, name: Light, tree: mage, usage: 1/combat, tier: normal, text: Opponents get -4 to combat
      rolls. You can see in darkness., starting: true}
  - id: mage-screen
    name: Mage Screen
    tree: mage
    usage: passive
    tier: normal
    text: Gain a permanent +2 Combat Modifier (Defence)
    prerequisites: {skill: light}
  - id: daylight
    name: Daylight
    tree: mage
    usage: 1/combat
    tier: normal
    text: Eliminate one foe's stealth.
    prerequisites: {skill: light}
  - id: mage-armor
    name: Mage Armor
    tree: mage
    usage: passive
    tier: normal
    text: Gain an additional permanent +2 Combat Modifier (Defence)
    prerequisites: {skill: mage-screen}
  - {id: find-familiar, name: Find Familiar, tree: mage, usage: passive, tier: normal, text: You can acquire
      a familiar by spending 3 XP or 9 Zenni., starting: true}
  - {id: arcane-wisdom, name: Arcane Wisdom, tree: mage, usage: passive, tier: normal, text: Gain 1 Arcane
      Slot (You can take this spell up to 5 times), starting: true, maxTimes: 5}
  - id: haste
    name: Haste
    tree: mage
    usage: 1/combat
    tier: normal
    text: Give 1 ally an additional skill use.
    prerequisites: {skill: arcane-wisdom}
  - id: counterspell
    name: Counterspell
    tree: mage
    usage: 1/combat
    tier: normal
    text: Prevent the casting of 1 foe's combat spell.
    prerequisites: {skill: haste}
  - id: weaken
    name: Weaken
    tree: mage
    usage: 1/combat
    tier: normal
    text: One foe takes -2 to their combat and strength rolls for the rest of combat.
    prerequisites: {skill: counterspell}
  - id: overchannel
    name: Overchannel
    tree: mage
    usage: 1/combat
    tier: normal
    text: Sacrifice 1♥ to cast 2 Mage spells this round, even if they are Tasks.
    prerequisites:
      all:
      - {skill: counterspell}
      - {skill: power-overload}
  - {id: mage-bolt, name: Mage Bolt, tree: mage, usage: passive, tier: normal, text: You can attack at range.,
    starting: true}
  - id: power-surge
    name: Power Surge
    tree: mage
    usage: 1/combat
    tier: normal
    text: Add +2 to this combat roll.
    prerequisites: {skill: mage-bolt}
  - id: power-blitz
    name: Power Blitz
    tree: mage
    usage: 1/combat
    tier: normal
    text: Add +4 to this combat roll.
    prerequisites: {skill: power-surge}
  - id: power-overload
    name: Power Overload
    tree: mage
    usage: 1/combat
    tier: normal
    text: Add +6 to this combat roll.
    prerequisites: {skill: power-blitz}
  - id: power-beam
    name: Power Beam
    tree: mage
    usage: 1/combat
    tier: epic
    text: Sacrifice 1♥ or any 2 combat spells to roll your combat dice again and add the total to this combat
      roll.
    prerequisites: {skill: overchannel}
  - {id: spell-focus, name: Spell Focus, tree: mage, usage: passive, tier: normal, text: Choose a spell.
      Increase its combat bonus by 2 or damage by 1♥., starting: true}
  - id: lesser-recovery
    name: Lesser Recovery
    tree: mage
    usage: 1/combat
    tier: normal
    text: Recover 1 used mage spell with fewer than 2 required spells/skills.
    prerequisites: {skill: spell-focus}
  - id: recovery
    name: Recovery
    tree: mage
    usage: 1/combat
    tier: normal
    text: Recover 1 used mage spell with fewer than 4 required spells/skills.
    prerequisites: {skill: lesser-recovery}
  - id: greater-recovery
    name: Greater Recovery
    tree: mage
    usage: 1/combat
    tier: normal
    text: Recover 1 used mage spell with fewer than 6 required spells/skills.
    prerequisites: {skill: recovery}
  - id: immolation
    name: Immolation
    tree: mage
    usage: task, 1/combat
    tier: epic
    text: Sacrifice all your remaining ♥s to deal that much damage to all foes. You cannot be revived from
      this death.
    prerequisites: {skill: power-beam}

  # Rogue
  - {id: pickpocket, name: Pickpocket, tree: rogue, usage: passive, tier: normal, text: 'Out of combat,
      place a clothespin on target. Gain 1d4 zenni or +2♥ on your first attack.', starting: true}
  - id: stroke-of-luck
    name: Stroke of Luck
    trees:
    - {tree: rogue, starting: true}
    - tree: swashbuckler
      prerequisites: {skill: fend}
    usage: 1/combat
    tier: normal
    text: Re-roll one die.
  - id: rogues-touch
    name: Rogue's Touch
    tree: rogue
    usage: 1/combat
    tier: normal
    text: Re-roll all of your combat dice.
    prerequisites: {skill: stroke-of-luck}
  - id: fortunate
    name: Fortunate
    tree: rogue
    usage: passive
    tier: normal
    text: You may re-roll any die result of 1, but you must take the new result.
    prerequisites: {skill: rogues-touch}
  - id: never-tell-me-the-odds
    name: Never Tell Me The Odds
    tree: rogue
    usage: 1/combat
    tier: epic
    text: Choose any one of your combat dice to automatically land on its maximum.
    prerequisites: {skill: fortunate}
    maintainerNote: Printed 'it's maximum'; corrected to 'its maximum' (Craig 2026-11-17).
  - {id: nimble, name: Nimble, tree: rogue, usage: passive, tier: normal, text: Gain +3 Combat Modifier
      (Defence), starting: true}
  - id: dodge
    name: Dodge
    tree: rogue
    usage: 1/combat
    tier: normal
    text: Gain +4 Combat Modifier (Defence)
    prerequisites: {skill: nimble}
  - id: dodge-ii
    name: Dodge II
    tree: rogue
    usage: 1/combat
    tier: normal
    text: Gain +6 Combat Modifier (Defence)
    prerequisites: {skill: dodge}
  - id: dodge-iii
    name: Dodge III
    tree: rogue
    usage: 1/combat
    tier: normal
    text: Negate 1♥ of damage.
    prerequisites: {skill: dodge-ii}
  - id: evasion
    name: Evasion
    trees:
    - tree: rogue
      prerequisites: {skill: dodge-ii}
    - tree: swashbuckler
      prerequisites: {skill: parry}
    usage: 1/combat
    tier: normal
    text: Avoid damage from an Area of Effect.
  - id: balance
    name: Balance
    tree: rogue
    usage: passive
    tier: normal
    text: Gain +2 to Agility-based Challenge Rolls.
    prerequisites: {skill: nimble}
  - {id: precise-strike, name: Precise Strike, tree: rogue, usage: 1/combat, tier: normal, text: Ignore
      1 opponent's Combat Modifier (Defence)., starting: true}
  - id: deadly-aim
    name: Deadly Aim
    tree: rogue
    usage: task, 1/combat
    tier: normal
    text: Deal 2♥ of damage to one opponent.
    prerequisites: {skill: precise-strike}
  - id: severe-wound
    name: Severe Wound
    tree: rogue
    usage: 1/combat
    tier: normal
    text: When one of your dice rolls max, add 2♥ to this round's damage.
    prerequisites: {skill: precise-strike}
  - id: critical-wound
    name: Critical Wound
    tree: rogue
    usage: 1/combat
    tier: normal
    text: When one of your dice rolls max, add 3♥ to this round's damage.
    prerequisites: {skill: severe-wound}
  - id: deadly-wound
    name: Deadly Wound
    tree: rogue
    usage: 1/combat
    tier: epic
    text: When one of your dice rolls max, add 5♥ to this round's damage.
    prerequisites: {skill: critical-wound}
  - {id: sneak-attack, name: Sneak Attack, tree: rogue, usage: 1/combat, tier: normal, text: Add 1x rogue
      stealth bonus to this combat roll., starting: true}
  - id: cunning-hide
    name: Cunning Hide
    tree: rogue
    usage: task
    tier: normal
    text: The following round becomes a stealth round. (requires a CR)
    prerequisites: {skill: sneak-attack}
  - id: shadow-strike
    name: Shadow Strike
    tree: rogue
    usage: 1/combat
    tier: normal
    text: If you beat your opponent's combat roll by 10 or more you may add your stealth bonus to your next
      combat roll.
    prerequisites: {skill: cunning-hide}

  # Battlecaster
  - id: two-as-one
    name: Two as One
    tree: battlecaster
    usage: 1/combat
    tier: normal
    text: If both weapons you are wielding have a combat ability, you can activate both this round as long
      as neither has been used this combat.
    prerequisites: {skill: dual-wielding}
  - id: swirl-of-steel-and-magic
    name: Swirl of Steel & Magic
    tree: battlecaster
    usage: 1/combat
    tier: normal
    text: As long as you have combat spells available, you can deal 3♥ of damage to up to 2 opponents.
    prerequisites: {skill: two-as-one}
  - id: arcane-weapon
    name: Arcane Weapon
    tree: battlecaster
    usage: passive
    tier: normal
    text: Weapons you wield gain +1♥ of damage as long as you have usable spells. (Dual wielding does not
      grant this bonus to both weapons.)
    prerequisites:
      all:
      - {skill: weapon-use}
      - {skill: knowledge}
  - id: arcane-training
    name: Arcane Training
    tree: battlecaster
    usage: passive
    tier: normal
    text: Take a Mage skill you qualify for. You may enter a Mage Advanced tree with this skill. Take this
      skill 5x to advance.
    prerequisites: {skill: arcane-weapon}
    maxTimes: 5
    maintainerNote: Printed 'skill skill'; corrected to 'skill' (Craig 2026-11-17).
  - id: martial-training
    name: Martial Training
    tree: battlecaster
    usage: passive
    tier: normal
    text: Take a Warrior skill you qualify for. You may enter a Warrior Advanced tree with this skill. Take
      this skill 5x to advance.
    prerequisites: {skill: arcane-weapon}
    maxTimes: 5
    maintainerNote: Printed 'skill skill'; corrected to 'skill' (Craig 2026-11-17).
  - id: war-magus
    name: War Magus
    tree: battlecaster
    usage: passive
    tier: epic
    text: You gain +2 Combat Modifier (Defence) and +1♥ of damage to all attacks and spells. Gain Epic Resistance
      vs. damage spells.
    prerequisites:
      any:
      - {skill: arcane-training}
      - {skill: martial-training}
  - id: arcane-shield
    name: Arcane Shield
    tree: battlecaster
    usage: 1/combat
    tier: normal
    text: Ignore 1♥ of damage caused by a spell. (Must have a shield equipped)
    prerequisites: {skill: armor-use}
  - id: reflect-spell
    name: Reflect Spell
    tree: battlecaster
    usage: 1/combat
    tier: normal
    text: Reflect the damage you would take from a spell back at its caster. (Must have a shield equipped.)
    prerequisites: {skill: arcane-shield}
  - id: arcane-armor
    name: Arcane Armor
    tree: battlecaster
    usage: 1/combat
    tier: normal
    text: Absorb a spell that targets you and use its energy to cast one of your combat spells without sacrificing
      it. (Must be wearing armor.)
    prerequisites: {skill: arcane-shield}
    maintainerNote: Printed 'use it's energy'; corrected to 'use its energy' (Craig 2026-11-17).
  - id: arcane-extension
    name: Arcane Extension
    tree: battlecaster
    usage: 1/combat
    tier: normal
