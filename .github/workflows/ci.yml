# CI for AWT Inventory (requirements TF-4, TF-5, TF-7, TF-11, TF-13, NF-11).
#
# Runs on every pull request and every push to main:
#   lint               ESLint, Prettier and the TypeScript compiler
#   test               rule scenarios, property tests, the data layer and the
#                      harness's own tests (Vitest). One of them runs the coverage
#                      check: every Must has a test, every tag is valid, and
#                      tests/COVERAGE.md is up to date (TF-4). Tests for unfinished
#                      milestones run as expected failures; finished milestones
#                      (package.json awt.finishedMilestones) must pass (TF-5).
#   access-rules       the Firestore security rules against the emulator (TF-11)
#   browser            phone-sized browser tests, iPhone and Android (TF-13)
# The test-change rule (TF-7) is in test-change-rule.yml, which always runs as
# it is on main.
# Changing this workflow, except to update action versions, fails the
# test-change check unless the requirements document changes too.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its older run. Every run on main
  # gets its own group, so none is cancelled or dropped from the queue.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Vitest, including the coverage check
        run: npm test

  access-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-
      - run: npm ci
      - name: Firestore rules in the emulator
        run: npm run test:access

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-
      # Installs only the browsers the cache doesn't already have, plus their system packages.
      - run: npx playwright install --with-deps chromium webkit
      - name: Phone-sized browser tests
        run: npm run test:browser
