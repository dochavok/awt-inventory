# CI for AWT Inventory (requirements TF-4, TF-5, TF-7, TF-11, TF-13, NF-11).
#
# Runs on every pull request and every push to main:
#   lint               ESLint, Prettier and the TypeScript compiler
#   test               rule scenarios, property tests, the data layer and the
#                      harness's own tests (Vitest), then the coverage table:
#                      every Must has a test, every tag is valid, and
#                      tests/COVERAGE.md is up to date (TF-4). Tests for unfinished
#                      milestones run as expected failures; finished milestones
#                      (package.json awt.finishedMilestones) must pass (TF-5).
#   access-rules       the Firestore security rules against the emulator (TF-11)
#   browser            phone-sized browser tests, iPhone and Android (TF-13)
#   test-change-check  pull requests only: the test-change rule (TF-7). See
#                      scripts/test-change-lib.ts for what it refuses.
# Changing this workflow, except to update action versions, fails the
# test-change check unless the requirements document changes too.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test
      - name: Coverage table
        run: npm run coverage:check

  access-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Firestore rules in the emulator
        run: npm run test:access

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Phone-sized browser tests
        run: npm run test:browser

  test-change-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Test-change rule
        # Uses the base branch's copy of the check when it has one, so a pull
        # request is always judged by the rules already on main.
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/$BASE:scripts/check-test-changes.ts" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" "origin/$BASE"
            ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
            npx tsx "$RUNNER_TEMP/base/scripts/check-test-changes.ts" --repo "$PWD" --base "origin/$BASE"
          else
            npm run check:test-changes -- --base "origin/$BASE"
          fi
