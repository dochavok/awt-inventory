# CI for AWT Inventory (requirements TF-4, TF-5, TF-7, TF-11, TF-13, NF-11).
#
# Runs on every pull request and every push to main:
#   lint               ESLint, Prettier and the TypeScript compiler; then, once
#                      functions/ exists, the Cloud Functions build, the same
#                      one the deploy runs (firebase.json predeploy, NF-11)
#   test               rule scenarios, property tests, the data layer and the
#                      harness's own tests (Vitest). One of them runs the coverage
#                      check: every Must has a test, every tag is valid, and
#                      tests/COVERAGE.md is up to date (TF-4). Tests for unfinished
#                      milestones run as expected failures; finished milestones
#                      (package.json awt.finishedMilestones) must pass (TF-5).
#   access-rules       the Firestore security rules against the emulator (TF-11)
#   browser            phone-sized browser tests, iPhone and Android, against
#                      the emulators (TF-13)
# The test-change rule (TF-7) is in test-change-rule.yml, which always runs as
# it is on main.
# Every job has a time limit (NF-11), so a stuck job fails instead of waiting
# for GitHub's 6-hour default.
# Changing this workflow, except to update action versions, fails the
# test-change check unless the requirements document changes too.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its older run. Every run on main
  # gets its own group, so none is cancelled or dropped from the queue.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          # The root's lockfile, and functions/' once it exists.
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci
      - run: npm run lint
      - name: Install the Cloud Functions packages
        if: hashFiles('functions/package.json') != ''
        working-directory: functions
        run: npm ci
      - name: Cloud Functions build
        if: hashFiles('functions/package.json') != ''
        working-directory: functions
        run: npm run build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Vitest, including the coverage check
        run: npm test

  access-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-
      - run: npm ci
      - name: Firestore rules in the emulator
        run: npm run test:access

  browser:
    runs-on: ubuntu-latest
    # Usually about 5 minutes, but the system packages for the browsers come from
    # Ubuntu's mirror, which is sometimes slow: those downloads took 14 minutes on
    # 2026-11-20. NF-11 allows 30. So most runs skip the mirror, the packages are
    # cached too (below).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-
      # The browsers' system packages (NF-11): apt's package files are cached per
      # runner image (new each week) and Playwright version. A miss restores the
      # newest older entry, so apt downloads only what has changed. apt checks
      # every file against Ubuntu's signed package lists, so a cached file can't
      # install anything it wouldn't download.
      - name: Name the system packages' cache
        id: apt-key
        run: |
          playwright=$(npx playwright --version | awk '{print $2}')
          echo "prefix=apt-$ImageOS-" >> "$GITHUB_OUTPUT"
          # The image's week only: runners in the same week report different build
          # numbers after it (20261116.88.1, 20261116.202.1).
          echo "key=apt-$ImageOS-${ImageVersion%%.*}-pw$playwright" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-cache
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}
      - name: Put the cached package files where apt looks
        if: steps.apt-cache.outputs.cache-matched-key != ''
        run: find ~/.cache/apt-archives -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +
      # Installs only the browsers the cache doesn't already have, plus their system packages.
      - run: npx playwright install --with-deps chromium webkit
      # Saved straight after the install, so a run whose tests fail still saves it.
      - name: Collect the package files for the cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get autoclean -qq
          rm -rf ~/.cache/apt-archives
          mkdir -p ~/.cache/apt-archives
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/apt-archives/ {} +
          du -sh ~/.cache/apt-archives
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
      - name: Phone-sized browser tests
        # TF-13: a failing test keeps its trace (steps, console, network); passing tests keep nothing.
        run: npm run test:browser -- --trace retain-on-failure
      # TF-13: what a failed test recorded, for 14 days. Made-up players and the emulators only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results/
            firestore-debug.log
            firebase-debug.log
          retention-days: 14
          if-no-files-found: ignore
