# Deploys AWT Inventory to Firebase (NF-11): the app (Hosting), the Cloud
# Functions and the Firestore rules.
#
# It runs once CI has passed for a push to main in this repository, and deploys
# exactly the commit CI checked. Its job uses the `production` environment,
# which holds the app's settings (variables) and the deploy credentials
# (secrets). Google Cloud is reached through Workload Identity Federation, so no
# long-lived key exists anywhere. docs/maintainer.md lists the variables and
# secrets.
# tests/ops/operations.test.ts checks this file.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # One deploy at a time; none is cancelled halfway. Runs can finish out of
  # order, so the job checks its commit is still the newest on main.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The whole history, so each help page shows when it was last changed (DOC-6).
          fetch-depth: 0
          persist-credentials: false
      - name: Check this commit is still the newest on main
        id: latest
        # CI runs can finish out of order (a re-run of an older commit's CI, say).
        # Only the newest commit on main deploys, so an older one never replaces it.
        run: |
          set -o pipefail
          newest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1) \
            || { echo "::error::Couldn't read main's newest commit"; exit 1; }
          if [ "$newest" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying: main has moved on to $newest, which deploys once its CI passes."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.latest.outputs.newest == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci
        if: steps.latest.outputs.newest == 'true'
      - name: Install the Cloud Functions packages
        if: steps.latest.outputs.newest == 'true'
        working-directory: functions
        run: npm ci
      - name: Build the app for the real project
        if: steps.latest.outputs.newest == 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          # Without the project's settings the build would talk to the local emulators.
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_SENTRY_DSN; do
            if [ -z "${!name}" ]; then echo "::error::The production environment has no $name variable"; exit 1; fi
          done
          npm run build
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.latest.outputs.newest == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase
        if: steps.latest.outputs.newest == 'true'
        # The Cloud Functions are built by firebase.json's predeploy step, as CI builds them.
        # --force: functions no longer in the code are removed, and the first deploy sets
        # up the cleanup policy for old function images, instead of stopping to ask.
        run: npx firebase deploy --only hosting,functions,firestore:rules --project awt-inventory --non-interactive --force
