# Keep dependencies current (NF-11).
# Each ecosystem's minor and patch updates come as one pull request a week. Major
# updates still come one per pull request, so a breaking one can be reviewed (or
# closed) on its own. Security updates aren't grouped and arrive as soon as found.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-packages:
        patterns: ["*"]
        update-types: [minor, patch]
  # The Cloud Functions have their own packages.
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    groups:
      functions-packages:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The functions run on Node 24, so their types stay on Node 24 until the
      # runtime moves (functions/package.json engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript's major versions move with the root's, once typescript-eslint
      # supports them, so the shared src/server code is checked by one version.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
