# The made-up sample character the user guide's examples come from (DOC-4).
# scripts/generate-docs.ts builds this account with the app's own code and
# writes its output into the guide's pages; `npm run docs:write` regenerates
# them after a change here or in the app. Kept apart from the test fixtures.
# Everything is made up except the skill and the level chart's numbers, which
# are from the real reference data in data/ (RD-8).
#
# The account is built in this order: entries, skills, titles and manual
# grants; then every `equip`, in the file's order; then every `trade`.

# When the sample account is made, in UTC.
at: "2026-05-02T18:00:00.000Z"
displayName: Lantern Keeper
character:
  name: Mirela
  className: Mage
  level: 9
  notes: Made-up sample character for the guide.
entries:
  - entry:
      category: items
      name: Moonlit Lantern
      description: Made-up item for the guide.
      rarity: epic
      itemFamily: Starglass
      arcane: true
      grants:
        - { kind: cm, amount: 2 }
        - { kind: die, die: 1d6 }
    gain:
      source: Quest
      link: https://example.com/rewards/42
      note: From the made-up Night Market quest
    equip: arcane
  - entry:
      category: armor
      name: Starglass Circlet
      slotKind: head
      grants:
        - { kind: mitigation, amount: 1 }
        - { kind: cm, amount: 1, condition: vs Undead }
    equip: head
  - entry:
      category: armor
      name: Wayfarer's Sash
      slotKind: belt
      grants:
        - { kind: slots, slotKind: back, amount: 1 }
    equip: belt
    trade:
      kind: traded
      note: A made-up trader
  - entry:
      category: armor
      name: Dusk Cloak
      slotKind: back
    equip: back
  - entry:
      category: armor
      name: Grey Cloak
      slotKind: back
    equip: back
  - entry:
      category: consumables
      name: Ember Tonic
      quantity: 2
    used:
      note: At the made-up river crossing
skills:
  - skillId: find-familiar
    howGained: starting
    levelGained: 1
titles:
  - name: Keeper of the Lanterns
    description: Made-up title for the guide.
    earned: "2026-04-18"
    grants:
      - { kind: cm, amount: 1 }
      - { kind: extra-damage, amount: 1, damageType: fire }
manualGrants:
  - reason: DM ruling, made-up faire
    grants:
      - { kind: hearts, amount: 1 }
      - { kind: extra-damage, amount: 2, condition: vs Undead }
